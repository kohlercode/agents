<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Module" />

<f:section name="Content">
    <div class="agents-chat-module"
         id="agents-chat-module"
         data-route-list-chats="{ajaxRoutes.listChats}"
         data-route-create-chat="{ajaxRoutes.createChat}"
         data-route-list-messages="{ajaxRoutes.listMessages}"
         data-route-send-message="{ajaxRoutes.sendMessage}">
        <div class="row g-3">
            <div class="col-12 col-lg-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0"><f:translate key="LLL:EXT:agents/Resources/Private/Language/locallang.xlf:chat.title" /></h2>
                        <button id="agents-new-chat" type="button" class="btn btn-sm btn-primary">
                            <f:translate key="LLL:EXT:agents/Resources/Private/Language/locallang.xlf:chat.new" />
                        </button>
                    </div>
                    <div class="list-group list-group-flush" id="agents-chat-list"></div>
                </div>
            </div>
            <div class="col-12 col-lg-8">
                <div class="card">
                    <div class="card-body" id="agents-message-list" style="min-height: 380px;"></div>
                    <div class="card-footer">
                        <form id="agents-chat-form">
                            <div class="input-group">
                                <input id="agents-chat-input"
                                       class="form-control"
                                       type="text"
                                       autocomplete="off"
                                       placeholder="{f:translate(key: 'LLL:EXT:agents/Resources/Private/Language/locallang.xlf:chat.placeholder')}" />
                                <button class="btn btn-primary" type="submit">Send</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="{f:uri.resource(path: 'JavaScript/Modules/agents-chat.js', extensionName: 'Agents')}"></script>
</f:section>
</html>
