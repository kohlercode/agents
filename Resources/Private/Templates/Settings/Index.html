<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Module" />

<f:section name="Content">
    <f:asset.script
        identifier="agents-settings-module"
        src="EXT:agents/Resources/Public/JavaScript/Modules/agents-settings.js"
        type="module"
    />

    <div class="agents-settings-module"
         id="agents-settings-module"
         data-route-get-settings="{ajaxRoutes.getSettings}"
         data-route-save-settings="{ajaxRoutes.saveSettings}"
         data-route-list-providers="{ajaxRoutes.listProviders}"
         data-route-save-provider="{ajaxRoutes.saveProvider}"
         data-route-activate-provider="{ajaxRoutes.activateProvider}">
        <h1 class="mb-4"><f:translate key="LLL:EXT:agents/Resources/Private/Language/locallang.xlf:settings.title" /></h1>
        <div class="row g-3">
            <div class="col-12 col-xl-6">
                <div class="card">
                    <div class="card-body">
                        <div class="form-floating mb-4">
                            <label for="agents-system-prompt" class="h3 mb-3">
                                <f:translate key="LLL:EXT:agents/Resources/Private/Language/locallang.xlf:settings.systemPrompt" />
                            </label>
                            <textarea id="agents-system-prompt" class="form-control" rows="12"></textarea>
                        </div>
                        <div class="form-floating mb-4">
                            <label for="agents-pinned-chats-limit" class="h4 mb-3">
                                <f:translate key="LLL:EXT:agents/Resources/Private/Language/locallang.xlf:settings.pinnedChatsLimit" />
                            </label>
                            <input id="agents-pinned-chats-limit"
                                   class="form-control"
                                   type="number"
                                   min="1"
                                   max="999"
                                   step="1"
                                   placeholder="20" />
                            <div class="form-text text-muted p-1">
                                <f:translate key="LLL:EXT:agents/Resources/Private/Language/locallang.xlf:settings.pinnedChatsLimit.help" />
                            </div>
                        </div>
                        <div class="form-floating mb-4">
                            <label for="agents-backend-module-position" class="h4 mb-3">
                                <f:translate key="LLL:EXT:agents/Resources/Private/Language/locallang.xlf:settings.backendModulePosition" />
                            </label>
                            <input id="agents-backend-module-position" class="form-control" type="text" placeholder="e.g. after:media" />
                        </div>
                        <button id="agents-save-settings" type="button" class="btn btn-primary mt-3">
                            <core:icon identifier="actions-save" size="small" />
                            <f:translate key="LLL:EXT:agents/Resources/Private/Language/locallang.xlf:settings.save" />
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-xl-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3><f:translate key="LLL:EXT:agents/Resources/Private/Language/locallang.xlf:settings.providers" /></h3>
                        <a href="{be:moduleLink(route: 'agents_settings.addProviderForm')}" class="btn btn-sm btn-primary"><core:icon identifier="actions-plus" size="small" /> New provider</a>
                    </div>
                    <div class="card-body">
                        <div id="agents-provider-list">
                            <f:for each="{providers}" as="provider">
                                <div class="rounded p-2 mb-2">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <p class="fw-bold mb-0 {f:if(condition: '{provider.is_active} == 1', then: 'text-success')}">{provider.title}</p>
                                            <div class="text-muted">{provider.provider_key} / {provider.model_identifier}</div>
                                        </div>
                                        <div>   
                                            <a href="{be:moduleLink(route: 'agents_settings.editProvider', arguments: {providerUid: provider.uid})}"
                                            class="btn btn-sm btn-default">
                                            <core:icon identifier="actions-pencil" size="small" />
                                        </a>
                                            <button class="btn btn-sm btn-default">
                                                <core:icon identifier="actions-delete" size="small" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </f:for>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</f:section>
</html>
